<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="The Old Veda mark">
  <defs>
    <linearGradient id="m_leafLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A8D85C"/>
      <stop offset="100%" stop-color="#6BAE2E"/>
    </linearGradient>
    <linearGradient id="m_leafMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5FA52B"/>
      <stop offset="100%" stop-color="#2F6A1C"/>
    </linearGradient>
    <linearGradient id="m_handGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3F8A3A"/>
      <stop offset="100%" stop-color="#1F4A1C"/>
    </linearGradient>
  </defs>
  <g transform="translate(100,100)">
    <circle r="92" fill="none" stroke="#3F8A3A" stroke-width="3"/>

    <!-- Center tulsi leaf -->
    <g transform="translate(0,8)">
      <path d="M 0 -78 C 7 -73, 14 -67, 18 -57 C 23 -47, 27 -36, 25 -23 C 23 -11, 17 -3, 0 2 C -17 -3, -23 -11, -25 -23 C -27 -36, -23 -47, -18 -57 C -14 -67, -7 -73, 0 -78 Z" fill="url(#m_leafLight)"/>
      <path d="M 0 -78 L 0 0" stroke="#2F6A1C" stroke-width="1.2"/>
    </g>

    <!-- Left tilted leaf -->
    <g transform="translate(-26,18) rotate(-42) scale(0.65)">
      <path d="M 0 -78 C 7 -73, 14 -67, 18 -57 C 23 -47, 27 -36, 25 -23 C 23 -11, 17 -3, 0 2 C -17 -3, -23 -11, -25 -23 C -27 -36, -23 -47, -18 -57 C -14 -67, -7 -73, 0 -78 Z" fill="url(#m_leafMid)"/>
      <path d="M 0 -78 L 0 0" stroke="#1F4A1C" stroke-width="1.2"/>
    </g>

    <!-- Right tilted leaf -->
    <g transform="translate(26,18) rotate(42) scale(0.65)">
      <path d="M 0 -78 C 7 -73, 14 -67, 18 -57 C 23 -47, 27 -36, 25 -23 C 23 -11, 17 -3, 0 2 C -17 -3, -23 -11, -25 -23 C -27 -36, -23 -47, -18 -57 C -14 -67, -7 -73, 0 -78 Z" fill="url(#m_leafMid)"/>
      <path d="M 0 -78 L 0 0" stroke="#1F4A1C" stroke-width="1.2"/>
    </g>

    <!-- Hands cradling -->
    <path d="M -68 48 C -76 32, -68 14, -50 16 C -42 2, -26 2, -22 18 C -10 14, 4 24, 2 40 C 6 48, 4 64, -10 70 C -30 84, -60 80, -68 64 Z" fill="url(#m_handGrad)"/>
    <path d="M 68 48 C 76 32, 68 14, 50 16 C 42 2, 26 2, 22 18 C 10 14, -4 24, -2 40 C -6 48, -4 64, 10 70 C 30 84, 60 80, 68 64 Z" fill="url(#m_handGrad)" transform="scale(-1,1)"/>
  </g>
</svg>
